# DiffusionCF (docs/design.md, section 7): conditional DDPM over the follower's next 5 s of accelerations,
# conditioned on the 3 s history and the leader's future speed. Mirrors the defaults of
# cf_unc.models.diffusion_cf.DiffusionCF / DEFAULT_TRAIN (checked in tests/test_diffusion.py).
name: diffusion_cf
kwargs:
  seq_len: 50               # samples of the generated sequence (5 s)
  n_samples: 32             # sampled sequences per window (predict_dist = SampleDist of their first steps)
  n_sampling_steps: 50      # DDIM sub-sequence of the training steps
  t_train: 1000             # cosine schedule steps
  eta: 1.0                  # DDIM stochasticity (1: ancestral-like, 0: deterministic)
  channels: 64              # residual 1-D conv stack
  n_blocks: 4
  kernel: 5
  hidden: 64                # LSTM history encoder
  replan_every: 50          # rollout: steps between two sampled plans (<= seq_len)
  predict_seed: 0           # noise seed of predict_dist / sample_sequences
  clip_x0: true             # clip the x0 prediction to the normalised [A_MIN, A_MAX]
  preview_steps: null       # training-time preview budget of the leader's future in steps (extension X1 stage B; null: the whole plan)
train:                      # overrides of configs/train/default.yaml
  max_epochs: 12            # 1 epoch without EMA (EMA warm-up) + 11 epochs with EMA
  batch_size: 64            # many optimiser steps per epoch: the fixed-decay EMA catches up quickly
  lr: 1.0e-3
  weight_decay: 0.0
  patience: 4
  min_delta: 1.0e-5         # the validation loss is deterministic (fixed steps and noises)
  lr_patience: 2
  ema_decay: 0.999
needs_idm: false
needs_sequences: true
