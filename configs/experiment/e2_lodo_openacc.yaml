# Experiment E6 (docs/design.md, section 16.1): the closed-loop rollouts of E2 (e2m.yaml, inherited through `base`)
# with the checkpoints of artifacts/e6_lodo_openacc (pooled domain without OpenACC), target a only: the held-out
# OpenACC (500 of all its events, as in e2m) and the highD test fold; highD validation is the calibration set.
#   bash scripts/run_e2_retry.sh artifacts/e2_lodo_openacc/logs/run.out 8 --config configs/experiment/e2_lodo_openacc.yaml
#   python scripts/analyze_e2.py --root artifacts/e2_lodo_openacc   (one-step conformal: the E1 tables of artifacts/e6_lodo_openacc)
base: e2m.yaml
root: artifacts/e2_lodo_openacc
train:
  data: [highd, ngsim, ngsim_us101, waymo]   # the pooled training domain of the checkpoints (e6_lodo_openacc.yaml)
targets:
  a: {checkpoints: artifacts/e6_lodo_openacc/checkpoints, hold_steps: 1}
  mean_1s: null               # not part of E6
datasets:                     # inherited: highd_val (val fold, calibration set), highd (test fold), openacc (all events)
  ngsim: null                 # training sets other than highD are not rolled (design.md 16.1)
  ngsim_us101: null
  waymo: null
e1_roots: {a: artifacts/e6_lodo_openacc, mean_1s: null}
