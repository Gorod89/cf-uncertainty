# Experiment E6 (docs/design.md, section 16.1): the closed-loop rollouts of E2 (e2m.yaml, inherited through `base`)
# with the checkpoints of artifacts/e6_lodo_ngsim (pooled domain without NGSIM I-80), target a only: the held-out NGSIM
# I-80 (500 of all its events, as in e2m) and the highD test fold; highD validation is the calibration set.
#   bash scripts/run_e2_retry.sh artifacts/e2_lodo_ngsim/logs/run.out 8 --config configs/experiment/e2_lodo_ngsim.yaml
#   python scripts/analyze_e2.py --root artifacts/e2_lodo_ngsim   (one-step conformal: the E1 tables of artifacts/e6_lodo_ngsim)
base: e2m.yaml
root: artifacts/e2_lodo_ngsim
train:
  data: [highd, ngsim_us101, waymo, openacc]   # the pooled training domain of the checkpoints (e6_lodo_ngsim.yaml)
targets:
  a: {checkpoints: artifacts/e6_lodo_ngsim/checkpoints, hold_steps: 1}
  mean_1s: null               # not part of E6
datasets:                     # inherited: highd_val (val fold, calibration set), highd (test fold), ngsim (all events)
  ngsim_us101: null           # training sets other than highD are not rolled (design.md 16.1)
  waymo: null
  openacc: null
e1_roots: {a: artifacts/e6_lodo_ngsim, mean_1s: null}
