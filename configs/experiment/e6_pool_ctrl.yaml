# Review control V7-R01 (docs/design.md 18.8): the history-only DiffusionCF of 18.1 (diffusion_cf_hist, no leader future)
# trained on the pooled domain of e6_pool.yaml: same matched signals, caps, seeds, target a, frozen IDM prior and
# evaluated sets, so that the equal-information comparison diffusion_cf vs diffusion_cf_hist exists for the pooled
