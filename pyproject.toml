[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-uncertainty"
version = "0.1.0"
description = "Epistemic and aleatoric uncertainty in learned car-following: state-space maps, dataset shift, and calibration under closed-loop rollouts"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=15",
  "torch>=2.2,<3",
  "gpytorch>=1.13",
  "hydra-core>=1.3,<1.4",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cf_unc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: tests that train models (E4 sanity, parameter recovery); deselect with -m 'not slow'",
  "data: tests that need downloaded datasets under data/raw (skipped when absent)",
  "gpu: requires CUDA",
]
