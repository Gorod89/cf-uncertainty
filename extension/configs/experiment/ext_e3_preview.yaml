# Extension X1 stage A (extension/docs/PLAN.md): the preview sweep of the leader's future on the STORED checkpoints.
# Every cell = one E3 signal variant of e3.yaml (same profiles, initial gaps, followers, rollouts, collision policy,
# seeds and reference idm_white_noise) with a `preview` spec handed to the diffusion sampler at every re-plan:
# horizon h (speeds up to h ahead, then the last seen value held; h0 = the constant-leader assumption), noise
# (i.i.d. Gaussian, m/s) at the full horizon, delay (stale preview) at the full horizon. Bases: raw = highD training
# (artifacts/e1, leader window 11), pool / lodo_openacc = the pooled training of E6 (leader window 61 of E5).
# The h5 cells carry no preview: they repeat the stored units of artifacts/e3 (raw, pool, lodo_openacc) exactly.
# Only idm_white_noise (the reference of every cell) and diffusion_cf run.
#   ./.venv/Scripts/python.exe scripts/run_e3.py --config extension/configs/experiment/ext_e3_preview.yaml --dry-run
#   bash scripts/run_e3_retry.sh extension/artifacts/ext_e3_preview/logs/run.out 8 --config extension/configs/experiment/ext_e3_preview.yaml
#   ./.venv/Scripts/python.exe scripts/analyze_e3.py --root extension/artifacts/ext_e3_preview
root: extension/artifacts/ext_e3_preview
device: auto
tf32: false
checkpoints: {a: artifacts/e1/checkpoints}            # variant raw = highD training, full preview (stored behaviour)
variants:
  raw_h0: {a: artifacts/e1/checkpoints, preview: {horizon_s: 0.0}}
  raw_h05: {a: artifacts/e1/checkpoints, preview: {horizon_s: 0.5}}
  raw_h1: {a: artifacts/e1/checkpoints, preview: {horizon_s: 1.0}}
  raw_h2: {a: artifacts/e1/checkpoints, preview: {horizon_s: 2.0}}
  raw_h3: {a: artifacts/e1/checkpoints, preview: {horizon_s: 3.0}}
  raw_n025: {a: artifacts/e1/checkpoints, preview: {noise_sigma: 0.25}}
  raw_n05: {a: artifacts/e1/checkpoints, preview: {noise_sigma: 0.5}}
  raw_n1: {a: artifacts/e1/checkpoints, preview: {noise_sigma: 1.0}}
  raw_d05: {a: artifacts/e1/checkpoints, preview: {delay_s: 0.5}}
  raw_d1: {a: artifacts/e1/checkpoints, preview: {delay_s: 1.0}}
  pool_h0: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {horizon_s: 0.0}}
  pool_h05: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {horizon_s: 0.5}}
  pool_h1: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {horizon_s: 1.0}}
  pool_h2: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {horizon_s: 2.0}}
  pool_h3: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {horizon_s: 3.0}}
  pool_h5: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}}
  pool_n025: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {noise_sigma: 0.25}}
  pool_n05: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {noise_sigma: 0.5}}
  pool_n1: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {noise_sigma: 1.0}}
  pool_d05: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {delay_s: 0.5}}
  pool_d1: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {delay_s: 1.0}}
  lodo_openacc_h0: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {horizon_s: 0.0}}
  lodo_openacc_h05: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {horizon_s: 0.5}}
  lodo_openacc_h1: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {horizon_s: 1.0}}
  lodo_openacc_h2: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {horizon_s: 2.0}}
  lodo_openacc_h3: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {horizon_s: 3.0}}
  lodo_openacc_h5: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}}
  lodo_openacc_n025: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {noise_sigma: 0.25}}
  lodo_openacc_n05: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {noise_sigma: 0.5}}
  lodo_openacc_n1: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {noise_sigma: 1.0}}
  lodo_openacc_d05: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {delay_s: 0.5}}
  lodo_openacc_d1: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, preview: {delay_s: 1.0}}
models:
  idm_white_noise: {target: a, sampler_mode: per_step, hold_steps: 1}
  diffusion_cf:    {target: a, sampler_mode: per_step, hold_steps: 1}
seeds: [0, 1, 2, 3, 4]
platoon: {n_followers: 20, n_rollouts: 100, n_rollouts_sampled: 32, history_s: 3.0, burn_in_s: 30.0, tail_s: 40.0,
          max_batch: 100000, seed: 0, gap_cap: 120.0, batch_profiles: 60, v_max: null}
profiles: configs/platoon/profiles.yaml
run_profiles: extended
idm: artifacts/e1/idm.json
sets: {headline: 10, extended: null}
calibration: {alpha: 0.1, gamma: 0.01, n_min: 5}
bootstrap: {n_boot: 1000, ci: 0.95, seed: 0}
h32: {support_min: 0.20, refute_max: 0.05, reference: idm_white_noise, references_extra: [], min_profiles: 5}
