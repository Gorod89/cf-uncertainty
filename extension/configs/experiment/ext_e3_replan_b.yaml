# Extension S8 (extension/docs/PLAN.md, section S): plan sharing between followers, added to the root of S3. At every
# re-plan a follower's diffusion sampler is handed the plan its predecessor sampled at the same instant (planned speeds,
# held beyond the plan) instead of the predecessor's realised future; the first follower keeps the recorded leader. With
# re-planning every 1 or 2 s (r10, r20) the shared plan is a genuine intention; r50 is the control where the plan and
# the realised future differ only at the standstill floor. Same run spec as ext_e3_replan.yaml.
#   bash scripts/run_e3_retry.sh extension/artifacts/ext_e3_replan/logs/run_b.out 8 --config extension/configs/experiment/ext_e3_replan_b.yaml
root: extension/artifacts/ext_e3_replan
device: auto
tf32: false
checkpoints: {}                                        # no raw variant in this file (the stored units of S3)
variants:
  pool_r10_share: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, share_plans: true, models: {diffusion_cf: {sampler: {replan_every: 10}}}}
  pool_r20_share: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, share_plans: true, models: {diffusion_cf: {sampler: {replan_every: 20}}}}
  pool_r50_share: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, share_plans: true, models: {diffusion_cf: {sampler: {replan_every: 50}}}}
  lodo_openacc_r10_share: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, share_plans: true, models: {diffusion_cf: {sampler: {replan_every: 10}}}}
  lodo_openacc_r20_share: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, share_plans: true, models: {diffusion_cf: {sampler: {replan_every: 20}}}}
  lodo_openacc_r50_share: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, share_plans: true, models: {diffusion_cf: {sampler: {replan_every: 50}}}}
models:
  idm_white_noise: {target: a, sampler_mode: per_step, hold_steps: 1}
  diffusion_cf:    {target: a, sampler_mode: per_step, hold_steps: 1}
seeds: [0, 1, 2, 3, 4]
platoon: {n_followers: 20, n_rollouts: 100, n_rollouts_sampled: 32, history_s: 3.0, burn_in_s: 30.0, tail_s: 40.0,
          max_batch: 100000, seed: 0, gap_cap: 120.0, batch_profiles: 60, v_max: null}
profiles: configs/platoon/profiles.yaml
run_profiles: extended
idm: artifacts/e1/idm.json
sets: {headline: 10, extended: null}
calibration: {alpha: 0.1, gamma: 0.01, n_min: 5}
bootstrap: {n_boot: 1000, ci: 0.95, seed: 0}
h32: {support_min: 0.20, refute_max: 0.05, reference: idm_white_noise, references_extra: [], min_profiles: 5}
