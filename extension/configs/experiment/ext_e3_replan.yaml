# Extension S3 (extension/docs/PLAN.md, section S): re-planning interval and DDIM sampling steps of the stored diffusion
# law, re-configured at inference through the model-spec key `sampler` (DiffusionCF.configure_sampler). Cells of the two
# pooled regimes (leader window 61): re-planning every 1, 2, 5 s at 50 sampling steps (r10, r20, r50) and 10, 25, 100
# sampling steps at re-planning every 5 s (s10, s25, s100); r50 repeats the stored pool / lodo_openacc units of
# artifacts/e3. The raw variant (highD checkpoints, stored sampler) repeats the stored raw units. S8 adds the plan-sharing
# cells (`share_plans`) to this root. Same profiles, gaps, followers, rollouts, seeds and reference as e3.yaml.
#   ./.venv/Scripts/python.exe scripts/run_e3.py --config extension/configs/experiment/ext_e3_replan.yaml --dry-run
#   bash scripts/run_e3_retry.sh extension/artifacts/ext_e3_replan/logs/run.out 8 --config extension/configs/experiment/ext_e3_replan.yaml
#   ./.venv/Scripts/python.exe scripts/analyze_e3.py --root extension/artifacts/ext_e3_replan
root: extension/artifacts/ext_e3_replan
device: auto
tf32: false
checkpoints: {a: artifacts/e1/checkpoints}
variants:
  pool_r10: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, models: {diffusion_cf: {sampler: {replan_every: 10}}}}
  pool_r20: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, models: {diffusion_cf: {sampler: {replan_every: 20}}}}
  pool_r50: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, models: {diffusion_cf: {sampler: {replan_every: 50}}}}
  pool_s10: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, models: {diffusion_cf: {sampler: {n_sampling_steps: 10}}}}
  pool_s25: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, models: {diffusion_cf: {sampler: {n_sampling_steps: 25}}}}
  pool_s100: {a: artifacts/e6_pool/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, models: {diffusion_cf: {sampler: {n_sampling_steps: 100}}}}
  lodo_openacc_r10: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, models: {diffusion_cf: {sampler: {replan_every: 10}}}}
  lodo_openacc_r20: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, models: {diffusion_cf: {sampler: {replan_every: 20}}}}
  lodo_openacc_r50: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, models: {diffusion_cf: {sampler: {replan_every: 50}}}}
  lodo_openacc_s10: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, models: {diffusion_cf: {sampler: {n_sampling_steps: 10}}}}
  lodo_openacc_s25: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, models: {diffusion_cf: {sampler: {n_sampling_steps: 25}}}}
  lodo_openacc_s100: {a: artifacts/e6_lodo_openacc/checkpoints, profile_window: {matching: artifacts/e1m/matching.json, data: openacc}, models: {diffusion_cf: {sampler: {n_sampling_steps: 100}}}}
models:
  idm_white_noise: {target: a, sampler_mode: per_step, hold_steps: 1}
  diffusion_cf:    {target: a, sampler_mode: per_step, hold_steps: 1}
seeds: [0, 1, 2, 3, 4]
platoon: {n_followers: 20, n_rollouts: 100, n_rollouts_sampled: 32, history_s: 3.0, burn_in_s: 30.0, tail_s: 40.0,
          max_batch: 100000, seed: 0, gap_cap: 120.0, batch_profiles: 60, v_max: null}
profiles: configs/platoon/profiles.yaml
run_profiles: extended
idm: artifacts/e1/idm.json
sets: {headline: 10, extended: null}
calibration: {alpha: 0.1, gamma: 0.01, n_min: 5}
bootstrap: {n_boot: 1000, ci: 0.95, seed: 0}
h32: {support_min: 0.20, refute_max: 0.05, reference: idm_white_noise, references_extra: [], min_profiles: 5}
